<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" fill="#0f2a4a" rx="48"/>
  
  <!-- Subtle gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4480;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2a4a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="256" height="256" fill="url(#bgGradient)" rx="48"/>
  
  <!-- MB Text -->
  <text x="128" y="168" font-family="'Playfair Display', serif" font-size="140" font-weight="700" fill="#ffffff" text-anchor="middle" font-style="italic">MB</text>
  
  <!-- Dot (.) -->
  <circle cx="188" cy="165" r="12" fill="#f47b20"/>
</svg>
